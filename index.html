<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShubhShree & Accounts Pvt Ltd</title>

    <!-- CSS (ROOT LEVEL - IMPORTANT FIX) -->
    <link rel="stylesheet" href="core.css">
    <link rel="stylesheet" href="themes.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="cursor.css">
    <link rel="stylesheet" href="modal.css">
    <link rel="stylesheet" href="chatbot.css">
</head>

<body>

    <div id="cursor"></div>

    <div class="bg-fixed">
        <video autoplay muted loop playsinline id="mainVideo">
            <source src="background.mp4" type="video/mp4">
        </video>
    </div>

    <!-- MODAL -->
    <div id="details-overlay">
        <div class="modal-content">
            <span class="close-btn">X</span>

            <span id="m-cat"></span>
            <h2 id="m-title"></h2>

            <ul id="m-list"></ul>

            <button id="apply-trigger">JOIN THE VISION</button>

            <form id="application-form" style="display:none;">
                <input id="f-name" placeholder="Name" required />
                <input id="f-phone" placeholder="Phone" required />
                <input id="f-email" placeholder="Email" required />
                <button type="submit">Submit</button>
            </form>
        </div>
    </div>

    <!-- NAV -->
    <div id="nav-menu">
        <span class="nav-close">X</span>
        <a href="javascript:void(0)" onclick="openAbout()">About Us</a>
        <a href="#services">Services</a>
        <a href="javascript:void(0)" onclick="openCareers()">Careers</a>
    </div>

    <header>
        <div class="burger-icon">
            <span></span><span></span><span></span>
        </div>
    </header>

    <!-- HERO -->
    <section class="hero">
        <div id="skillsCloud"></div>
    </section>

    <!-- SERVICES -->
    <section id="services">
        <div class="service-card">Logistics Finance</div>
        <div class="service-card">Business Operations</div>
        <div class="service-card">Execution</div>
        <div class="service-card">Reporting</div>
    </section>

    <!-- FLIP TEXT -->
    <div class="flipping-banner-container">
        <h2>Why choose us?</h2>
        <p id="flipping-text"></p>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>ShubhShree & Accounts</p>
    </footer>

    <!-- CHATBOT -->
    <div id="bot-toggle">💬</div>

    <div id="bot-container">
        <div id="bot-header">
            <span>Assistant</span>
            <span>X</span>
        </div>

        <div id="bot-messages"></div>

        <div id="bot-input-area">
            <input id="bot-input" type="text" />
            <button>Send</button>
        </div>
    </div>

    <!-- JS -->
    <script type="module" src="js/app.js"></script>

</body>
</html>
